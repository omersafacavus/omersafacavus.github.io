      tr: "2232-A'nın kariyer başındaki karşılığı; doktorasını tamamlayalı en fazla dört yıl olan ve yurt dışında en az bir yıl doktora sonrası deneyimi bulunan araştırmacılar için. Başlangıç paketine ek olarak ₺3.000.000'a kadar araştırma desteği, aile desteği ve sağlık sigortası sağlanır."

