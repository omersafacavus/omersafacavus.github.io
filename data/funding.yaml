# deadline_text: takvimi tek tarihe sığmayan programlar için serbest metin.
#   Verildiğinde deadline alanının yerine geçer.
meta:
  verified: "2026-09-29"

calls:
  - id: erc-starting-2027
    title:
      en: "ERC Starting Grant 2027"
      tr: "ERC Başlangıç Hibesi 2027"
    funder:
      en: "European Research Council"
      tr: "Avrupa Araştırma Konseyi"
    program: "Horizon Europe"
    type: grant
    stage: postdoc
    region: eu
    deadline: "2026-10-14"
    duration:
      en: "5 years"
      tr: "5 yıl"
    budget:
      en: "€1,500,000 (+ up to €1M)"
      tr: "€1.500.000 (+ €1M'a kadar)"
    status: open
    periodic: true
    url: "https://erc.europa.eu/apply-grant/starting-grant"
    description:
      en: "Funding for early-career researchers to build their own team and pursue frontier research. The 2027 Work Programme widened eligibility to 0–10 years since PhD, and applicants may submit only one ERC proposal per Work Programme."
      tr: "Kariyerinin başındaki araştırmacıların kendi ekiplerini kurarak öncü araştırma yapması için hibe. 2027 Çalışma Programı uygunluk aralığını doktoradan sonraki 0–10 yıla genişletti ve her Çalışma Programı için yalnızca tek bir ERC başvurusuna izin veriliyor."

