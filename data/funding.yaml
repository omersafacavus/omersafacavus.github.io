      tr: "Avrupa'da veya uluslararası bir kurumda araştırma yapmak için bireysel burslar; Avrupa ve Küresel seçenekleri var. 2026 çağrısı 9 Eylül 2026'da kapandı. 2027 çağrısının 7 Nisan 2027'de €388,57M bütçeyle açılması bekleniyor, tarihler henüz kesinleşmedi."

  - id: horizon-collaborative
    title:
      en: "Horizon Europe Cluster 4 Collaborative Projects"
      tr: "Horizon Europe Küme 4 İşbirlikçi Projeler"
