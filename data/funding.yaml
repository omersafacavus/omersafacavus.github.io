      en: "Funding for mid-career researchers to consolidate their group and research programme. The 2027 eligibility window is 5–15 years since PhD, which now overlaps with the Starting Grant window."
      tr: "Kariyerinin ortasındaki araştırmacıların grubunu ve araştırma programını pekiştirmesi için hibe. 2027 uygunluk aralığı doktoradan sonraki 5–15 yıl olup artık Başlangıç Hibesi aralığıyla kesişiyor."

  - id: cost-actions
    title:
      en: "COST Open Call OC-2026-1"
      tr: "COST Açık Çağrı OC-2026-1"
    funder: "COST Association"
    program: "COST"
    type: grant
    stage: any
    region: eu
    deadline: "2026-10-28"
    duration:
      en: "4 years"
      tr: "4 yıl"
    budget:
      en: "€125,000 year 1, ~€150,000/year after"
      tr: "1. yıl €125.000, sonraki yıllar ~€150.000"
    status: open
    periodic: true
    url: "https://www.cost.eu/how-to-apply/"
    description:
      en: "Funding for pan-European research networks. COST does not fund the research itself but supports networking, workshops, short-term scientific missions and training schools. Proposals need researchers from at least seven COST member countries. Around 80 Actions will be funded from this collection."
      tr: "Avrupa çapında araştırma ağları için finansman. COST araştırmanın kendisini değil; ağ oluşturma, atölye, kısa süreli bilimsel görev ve eğitim okullarını destekler. Başvurularda en az yedi COST üyesi ülkeden araştırmacı gerekir. Bu dönemde yaklaşık 80 Eylem desteklenecek."

