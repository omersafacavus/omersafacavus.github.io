    region: de
    deadline: ""
    deadline_text:
      en: "Three rounds a year, next opens 15 Nov 2026"
      tr: "Yılda üç dönem, sıradaki 15 Kas 2026"
    duration:
      en: "6–24 months"
      tr: "6–24 ay"
    budget:
      en: "€3,000/month (experienced: €3,600)"
