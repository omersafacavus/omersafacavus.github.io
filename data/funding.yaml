    description:
      en: "Large-scale collaborative research and innovation under Cluster 4 (Digital, Industry and Space), including advanced manufacturing and materials topics. Consortia need at least three partners from different member or associated states. HORIZON-CL4-2027-01 closes on 2 February 2027, with further deadlines on 18 March and 2 September 2027."
      tr: "Küme 4 (Dijital, Sanayi ve Uzay) kapsamında büyük ölçekli işbirlikçi araştırma ve inovasyon; ileri imalat ve malzeme konuları dahil. Konsorsiyumlarda en az üç farklı üye veya ortak ülkeden partner gerekir. HORIZON-CL4-2027-01 çağrısı 2 Şubat 2027'de kapanıyor; 18 Mart ve 2 Eylül 2027'de başka son tarihler var."

  - id: tubitak-1001
    title:
      en: "TÜBİTAK 1001 Scientific and Technological Research Projects"
      tr: "TÜBİTAK 1001 Bilimsel ve Teknolojik Araştırma Projeleri"
    funder: "TÜBİTAK"
    program: "1001"
    type: grant
    stage: any
    region: tr
    deadline: "2026-09-14"
    duration:
      en: "Up to 36 months"
      tr: "36 aya kadar"
    budget:
      en: "₺3,000,000"
      tr: "₺3.000.000"
    status: closed
    periodic: true
    url: "https://tubitak.gov.tr/tr/destekler/akademik/ulusal-destek-programlari/1001-bilimsel-ve-teknolojik-arastirma-projelerini-destekleme-programi"
    description:
      en: "Turkey's principal investigator-driven research grant, open to all disciplines. It runs in two fixed periods a year rather than continuously. The 2026 second period closed on 14 September 2026; the 2027 first period is expected around March 2027. The ceiling is ₺3,000,000 excluding scholarships, incentive premiums and institutional share."
      tr: "Tüm disiplinlere açık, araştırmacı odaklı temel araştırma desteği. Sürekli değil, yılda iki sabit dönem hâlinde açılır. 2026 ikinci dönemi 14 Eylül 2026'da kapandı; 2027 birinci döneminin Mart 2027 civarında açılması bekleniyor. Üst limit burs, proje teşvik ikramiyesi ve kurum hissesi hariç ₺3.000.000'dur."

  - id: tubitak-1002
    title:
      en: "TÜBİTAK 1002-A Short-Term R&D Funding"
      tr: "TÜBİTAK 1002-A Hızlı Destek Modülü"
    funder: "TÜBİTAK"
    program: "1002-A"
    type: grant
    stage: any
    region: tr
    deadline: ""
    duration:
      en: "Up to 12 months"
      tr: "12 aya kadar"
    budget:
      en: "₺150,000"
      tr: "₺150.000"
    status: open
    periodic: true
    url: "https://tubitak.gov.tr/tr/destekler/akademik/ulusal-destek-programlari/1002-hizli-destek-modulu"
    description:
      en: "Fast-track funding for short-term, well-scoped research projects. Applications are accepted year-round with no deadline. The ceiling rose to ₺150,000 including scholarships on 1 February 2026, and the e-signature step must be completed within 15 days of submission."
      tr: "Kısa süreli ve kapsamı net araştırma projeleri için hızlı destek. Başvurular yıl boyunca, zaman kısıtı olmadan alınır. Üst limit 1 Şubat 2026'da burs dahil ₺150.000'e yükseldi; e-imza süreci başvurudan sonraki 15 gün içinde tamamlanmalıdır."

  - id: tubitak-2232-a
    title:
      en: "TÜBİTAK 2232-A International Leading Researchers Programme"
      tr: "TÜBİTAK 2232-A Uluslararası Lider Araştırmacılar Programı"
    funder: "TÜBİTAK"
    program: "2232-A"
    type: fellowship
    stage: senior
    region: tr
    deadline: ""
    deadline_text:
      en: "2026 call not yet announced (2025: 30 Dec)"
      tr: "2026 çağrısı henüz duyurulmadı (2025: 30 Aralık)"
    duration:
      en: "24–36 months"
      tr: "24–36 ay"
    budget:
      en: "₺200,000/month + ₺3,000,000 project"
      tr: "₺200.000/ay + ₺3.000.000 proje"
    status: upcoming
    periodic: true
    url: "https://tubitak.gov.tr/tr/burslar/uluslararasi/arastirma-burs-programlari/2232-uluslararasi-lider-arastirmacilar-programi"
    description:
      en: "Brings experienced researchers working abroad to a Turkish host institution. Alongside the monthly salary it provides a one-off research start-up package of ₺4,700,000 and family support of ₺15,000 a month. The most recent call ran from 27 September to 30 December 2025."
      tr: "Yurt dışında çalışan deneyimli araştırmacıları Türkiye'deki bir kuruma getirir. Aylık ücretin yanında bir defaya mahsus ₺4.700.000 araştırma başlangıç paketi ve aylık ₺15.000 aile desteği sağlar. Son çağrı 27 Eylül ile 30 Aralık 2025 arasında açıktı."

