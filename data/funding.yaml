  - id: daad-prime
    title:
      en: "DAAD Postdoctoral Researchers International Mobility Experience (PRIME)"
      tr: "DAAD Doktora Sonrası Uluslararası Hareketlilik Deneyimi (PRIME)"
    funder: "DAAD"
    program: "PRIME"
    type: fellowship
    stage: postdoc
    region: de
    deadline: "2027-04-15"
    duration:
      en: "18 months (12 abroad + 6 Germany)"
      tr: "18 ay (12 yurt dışı + 6 Almanya)"
    budget:
      en: "€5,000–6,400/month gross (TV-L E13)"
      tr: "Brüt €5.000–6.400/ay (TV-L E13)"
    status: upcoming
    periodic: true
    url: "https://www.daad.de/en/studying-in-germany/scholarships/daad-funding-programmes/prime/prime-applicants/"
    description:
      en: "Funds a 12-month research phase abroad followed by a 6-month integration phase at a German university, on a fixed-term contract rather than a stipend, plus an expatriate allowance of about €1,500 to €2,800 a month while abroad. Eligibility changed for this round: you must have studied or worked in the German higher education or research system for at least three of the five years before the deadline, and apply within six years of your first PhD. There is no separate family support and no research or bench funding. The call is published in autumn 2026, the portal opens in January 2027, and funding starts between April and September 2028."
      tr: "12 aylık yurt dışı araştırma aşamasını, Almanya'daki bir üniversitede 6 aylık entegrasyon aşaması izler; burs değil süreli iş sözleşmesi sağlanır ve yurt dışı aşamasında aylık yaklaşık €1.500 ile €2.800 arası yurt dışı ödeneği verilir. Bu dönemde uygunluk koşulu değişti: son başvurudan önceki beş yılın en az üçünde Alman yükseköğretim veya araştırma sisteminde okumuş ya da çalışmış olmak ve ilk doktoranızın üzerinden en fazla altı yıl geçmiş olması gerekiyor. Ayrı aile desteği ve araştırma gideri desteği yok. Çağrı 2026 sonbaharında yayımlanıyor, portal Ocak 2027'de açılıyor, destek Nisan ile Eylül 2028 arasında başlıyor."

  - id: tum-global-postdoc
    title:
      en: "TUM Global Postdoc Fellowship"
      tr: "TUM Küresel Doktora Sonrası Bursu"
    funder:
      en: "Technical University of Munich"
      tr: "Münih Teknik Üniversitesi"
    program: ""
    type: fellowship
    stage: postdoc
    region: de
    deadline: "2026-09-30"
    duration:
      en: "24 months"
      tr: "24 ay"
    budget: ""
    status: open
    periodic: true
    url: "https://www.tum.de/en/about-tum/careers-and-jobs/postdocs/tum-global-postdoc-fellowship"
    description:
      en: "Competitive fellowships for international researchers at one of Europe's leading technical universities. Call 6 closes on 30 September 2026. Applicants must live outside Germany at submission and have finished their doctorate within the past three years or expect to finish within twelve months. Phase I is judged without a host letter; only shortlisted candidates need a TUM host in Phase II."
      tr: "Avrupa'nın önde gelen teknik üniversitelerinden birinde uluslararası araştırmacılar için rekabetçi burslar. 6. çağrı 30 Eylül 2026'da kapanıyor. Başvuru anında Almanya dışında ikamet etmek ve doktorayı son üç yıl içinde bitirmiş olmak ya da on iki ay içinde bitirecek olmak gerekir. Birinci aşama ev sahibi mektubu olmadan değerlendirilir; TUM'da ev sahibi yalnızca ikinci aşamaya kalanlardan istenir."
