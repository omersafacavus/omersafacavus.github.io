lead:
  en: "I build physics-based models for laser powder bed fusion: from part design to scan path, from thermal simulation to microstructure."
  tr: "Toz yataklı lazer füzyon için fizik tabanlı modeller geliştiriyorum: parça tasarımından tarama yoluna, termal simülasyondan mikroyapıya kadar."
