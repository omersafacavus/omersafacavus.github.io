lead:
  en: "I build physics-based models that connect design, simulation and production in metal additive manufacturing: from custom scan paths to thermal history, microstructure and defects, validated by experiment. My work spans laser powder bed fusion, beam shaping, process-aware topology optimization and machine learning."
  tr: "Metal eklemeli imalatta tasarım, simülasyon ve üretimi birbirine bağlayan fizik tabanlı modeller geliştiriyorum: özel tarama yollarından termal geçmişe, oradan mikroyapıya ve kusurlara kadar, deneyle doğrulayarak. Toz yataklı lazer füzyon, ışın şekillendirme, proses odaklı topoloji optimizasyonu ve makine öğrenmesi üzerinde çalışıyorum."
availability:
