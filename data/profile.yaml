lead:
  en: "I build physics-based models that connect design, simulation and experiment in metal additive manufacturing, using computational tools I write myself to link process to microstructure and part performance."
  tr: "Metal eklemeli imalatta tasarımı, simülasyonu ve deneyi birleştiren fizik tabanlı modeller geliştiriyorum; kendi yazdığım hesaplama araçlarıyla prosesi mikroyapıya ve parça performansına bağlıyorum."
