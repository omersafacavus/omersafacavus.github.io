  tr: "Projelere ve iş birliklerine açık"
about:
  en:
    - "I am a manufacturing engineer. My doctoral research at Sabancı University, supervised by Prof. Bahattin Koç, addresses the process–structure–property–performance chain in metal additive manufacturing through physics-based models. At its center is an in-house parametric modeling framework I built from scratch, spanning design, numerical analysis and manufacturing: a slicer grounded in computational geometry generates scan paths from the part geometry, prepares the thermal-simulation inputs and exports the build-machine files."
    - "With the solvers I developed, I predict cooling and solidification rates and couple them to grain structure through a Potts kinetic Monte Carlo model. I design scan strategies that reduce stitch-zone defects and validate my predictions against multi-scale X-ray CT, SEM, XRD and mechanical testing."
    - "My research also spans process-aware topology optimization, beam shaping, and AI methods that extract process signatures from detector signals. As a consultant at Machina3D, I brought these computational methods into industrial production, from additive manufacturing process and support-structure design to automated mold generation and heat treatment in aluminum casting."
  tr:
    - "İmalat mühendisiyim ve doktora araştırmamı Sabancı Üniversitesi'nde Prof. Dr. Bahattin Koç danışmanlığında yürütüyorum. Metal eklemeli imalatı fizik tabanlı modellerle inceliyor, üretim koşullarının parçanın iç yapısını ve mekanik davranışını nasıl belirlediğini anlamaya çalışıyorum. Bu amaçla, tasarımdan üretime kadar bütün adımları kapsayan ve sıfırdan yazdığım bir modelleme çerçevesi geliştirdim. Çerçevenin dilimleyicisi, parçanın geometrisinden tarama yollarını üretiyor, simülasyon girdilerini hazırlıyor ve makinenin okuyacağı üretim dosyalarını oluşturuyor."
    - "Geliştirdiğim çözücüler, üretim sırasında oluşan soğuma ve katılaşma hızlarını hesaplıyor. Bu hızları kinetik Monte Carlo yöntemiyle tane yapısına bağlıyor, tarama stratejilerini de dikiş bölgelerindeki kusurları azaltacak biçimde tasarlıyorum. Modellerimin sonuçlarını X-ışını tomografisi, elektron mikroskobu, X-ışını kırınımı ve mekanik testlerle doğruluyorum."
    - "Bunların yanında topoloji optimizasyonu, ışın şekillendirme ve dedektör sinyallerinden üretim izlerini çıkaran yapay zeka yöntemleri üzerine araştırma yapıyorum. Machina3D'de danışman olarak çalışırken geliştirdiğim yöntemleri sanayiye taşıdım; eklemeli imalatta proses ve destek yapısı tasarımından alüminyum dökümde kalıp üretimi ve ısıl işleme kadar farklı projelerde yer aldım."
