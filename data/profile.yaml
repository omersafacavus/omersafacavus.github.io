  tr: "Projelere ve iş birliklerine açık"
about:
  en:
    - "I am a manufacturing engineer. My doctoral research at Sabancı University, supervised by Prof. Bahattin Koç, addresses the process–structure–property–performance chain in metal additive manufacturing through physics-based models. At its center is an in-house parametric modeling framework I built from scratch, spanning design, numerical analysis and manufacturing: a slicer grounded in computational geometry generates scan paths from the part geometry, prepares the thermal-simulation inputs and exports the build-machine files."
    - "With the solvers I developed, I predict cooling and solidification rates and couple them to grain structure through a Potts kinetic Monte Carlo model. I design scan strategies that reduce stitch-zone defects and validate my predictions against multi-scale X-ray CT, SEM, XRD and mechanical testing."
    - "My research also spans process-aware topology optimization, beam shaping, and AI methods that extract process signatures from detector signals. As a consultant at Machina3D, I brought these computational methods into industrial production — from additive manufacturing process and support-structure design to automated mold generation and heat treatment in aluminum casting."
  tr:
    - "İmalat mühendisiyim. Sabancı Üniversitesi'nde Prof. Dr. Bahattin Koç danışmanlığında yürüttüğüm doktora çalışmam, metal eklemeli imalatta proses–yapı–özellik–performans zincirini fizik tabanlı modellerle ele alıyor. Çalışmalarımın merkezinde, tasarımdan sayısal analize ve üretime uzanan, sıfırdan geliştirdiğim parametrik bir modelleme çerçevesi var: hesaplamalı geometriye dayanan bir dilimleyici, parça geometrisinden tarama yollarını üretir, termal simülasyon girdilerini hazırlar ve makine dosyalarını çıkarır."
    - "Geliştirdiğim çözücülerle soğuma ve katılaşma hızlarını öngörüyor, bunları Potts kinetik Monte Carlo modeliyle tane yapısına bağlıyorum. Tarama stratejilerini dikiş bölgesi kusurlarını azaltacak biçimde tasarlıyor, tahminlerimi çok ölçekli X-ışını BT, SEM, XRD ve mekanik testlerle doğruluyorum."
    - "Araştırmam ayrıca proses odaklı topoloji optimizasyonunu, ışın şekillendirmeyi ve dedektör sinyallerinden proses imzalarını çıkaran yapay zekâ yöntemlerini kapsıyor. Machina3D'de danışman olarak, geliştirdiğim hesaplama yöntemlerini sanayi üretimiyle buluşturdum: eklemeli imalatta proses ve destek yapısı tasarımından alüminyum dökümde otomatik kalıp üretimi ve ısıl işleme kadar."
