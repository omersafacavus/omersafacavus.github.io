about:
  en:
    - "I am completing an Integrated Ph.D. in Manufacturing Engineering at Sabancı University. I developed an in-house parametric framework that connects part design, scan-path generation, thermal simulation and build-file export, and I validate my models with X-ray CT, XRD, SEM and mechanical testing."
    - "At Machina3D I worked on additive manufacturing process design and aluminum casting. Today I work on beam shaping, machine learning for process monitoring, and other metal additive processes such as DED, cold spray and EBM."
  tr:
    - "Sabancı Üniversitesi'nde İmalat Mühendisliği bütünleşik doktoramı tamamlıyorum. Parça tasarımını, tarama yolu üretimini, termal simülasyonu ve makine dosyası çıktısını tek bir ortamda birleştiren parametrik bir çerçeve geliştirdim; modellerimi X-ışını BT, XRD, SEM ve mekanik testlerle doğruluyorum."
    - "Machina3D'de eklemeli imalat proses tasarımı ve alüminyum döküm üzerine çalıştım. Bugün ışın şekillendirme, proses izleme için makine öğrenmesi ve DED, soğuk püskürtme, EBM gibi diğer metal eklemeli imalat yöntemleri üzerinde çalışıyorum."
